<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Faraz</title>
    <meta name="description" content="Contact Faraz, Senior Finance Officer based in Karachi, Pakistan." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact — Faraz" />
    <meta property="og:description" content="Get in touch with Faraz, Senior Finance Officer." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Contact — Faraz" />
    <meta name="twitter:description" content="Get in touch with Faraz, Senior Finance Officer." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230f4c3a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='700'%3EF%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="top">
      <div class="container">
        <a class="brand" href="/">Faraz</a>
        <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false">
          Menu
        </button>
        <nav class="site-nav" id="site-nav" data-open="false" aria-label="Primary">
          <ul>
            <li><a href="/work/">Work</a></li>
            <li><a href="/about/" aria-current="page">About</a></li>
            <li><a href="/resume/">Resume</a></li>
            <li><a href="/contact/" aria-current="page">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="section">
        <div class="container">
          <h1>Contact</h1>
          <p>Prefer email? Reach out directly at <a href="mailto:farazacma@hotmail.com">farazacma@hotmail.com</a>.</p>

          <form data-form novalidate>
            <div class="form-field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="form-field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <div class="honeypot" aria-hidden="true">
              <label for="company_honeypot">Company</label>
              <input id="company_honeypot" name="company_honeypot" type="text" tabindex="-1" autocomplete="off" />
            </div>
            <button class="btn" type="submit">Send message</button>
            <p class="form-status" data-form-status hidden></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span data-year></span> Faraz</p>
        <p><a href="/">Home</a></p>
      </div>
    </footer>
  </body>
</html>
